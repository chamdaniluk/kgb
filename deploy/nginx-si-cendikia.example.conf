server {
    listen 80;
    listen [::]:80;
    server_name kgb.example.go.id;

    client_max_body_size 7m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kgb.example.go.id;

    ssl_certificate /etc/letsencrypt/live/kgb.example.go.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kgb.example.go.id/privkey.pem;
    client_max_body_size 7m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

# Replace the example hostname and certificate paths before enabling.
# Validate with: nginx -t
# Reload only after an explicit deployment approval.
